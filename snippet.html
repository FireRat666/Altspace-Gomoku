<bs-snippet name="gomoku" title="Gomoku"
  description="Synced multiplayer upright Gomoku (five in a row) board with seat locking."
  script="https://gomoku.firer.at/snippet.js"
  room=""
  position="0 1.5 2"
  rotation="0 0 0"
  scale="1"
  board-size="15"
  lit="true"
  add-lights="false"
  turn-cooldown="5"
  lock-timeout="90"
  cull-distance="20"
  sound-volume="0.4"
  sound-near="2.5"
  sound-far="10"
  hide-ui="false"
  hide-board="false"
  use-custom-models="true"
  use-ao-baking="false"
  scoreboard-position="0 0 0"
  scoreboard-rotation="0 0 0"
  scoreboard-scale="1">
  <bs-gizmo type="position" attribute="position"/>
  <bs-gizmo type="plane" attribute="position" size="1.5 1.5"/>
</bs-snippet>
